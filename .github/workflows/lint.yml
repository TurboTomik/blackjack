name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libncurses-dev

      - name: Generate compile_commands.json
        run: |
          sudo apt-get install -y bear
          make bear

      - name: Run clang-tidy
        run: make lint
